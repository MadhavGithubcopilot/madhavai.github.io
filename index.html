<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MADHAV ACADEMY</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.box,.card{background:white;border:1px solid #dfe5ee;border-radius:18px;padding:22px;box-shadow:0 8px 25px #17203312}.box{width:min(440px,100%)}input,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #cfd7e3;border-radius:9px}.primary,.secondary,.danger,.nav button{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.primary{background:#2457e6;color:#fff}.secondary{background:#eaf0ff;color:#2457e6}.danger{background:#ffecec;color:#c33}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#101a2e;color:white;padding:16px;display:flex;flex-direction:column}.nav{display:grid;gap:6px;margin-top:25px}.nav button{background:transparent;color:#bdc8db;text-align:left}.nav button.active,.nav button:hover{background:#1e2c48;color:white}.bottom{margin-top:auto}.main{min-width:0}.top{height:68px;background:white;border-bottom:1px solid #e0e5ed;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0}.search{max-width:420px}.content{padding:24px;max-width:1400px;margin:auto}.hero{background:linear-gradient(135deg,#2457e6,#5a83f2);color:white;padding:28px;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}.stat{padding:18px;background:white;border:1px solid #e0e5ed;border-radius:14px}.stat b{font-size:26px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{border:1px solid #d7deea;background:white;border-radius:9px;padding:9px}.tabs button.active{background:#2457e6;color:white}.modal{position:fixed;inset:0;background:#081020aa;display:grid;place-items:center;padding:18px;z-index:10}.modal>div{background:white;color:#172033;border-radius:16px;padding:22px;width:min(850px,100%);max-height:90vh;overflow:auto}.watermark{position:absolute;inset:0;display:grid;place-items:center;font-size:55px;font-weight:900;color:#2457e615;transform:rotate(-30deg);pointer-events:none}.paper{position:relative;background:white;color:#111;padding:40px;min-height:900px}.paper>*{position:relative}.q{margin:18px 0}.option{display:block;border:1px solid #ddd;padding:9px;border-radius:8px;margin:6px 0}.muted{color:#687386}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:20;left:-250px;top:0;bottom:0;width:240px;transition:.2s}.side.open{left:0}.menu{display:block}.stats{grid-template-columns:1fr 1fr}}@media(min-width:801px){.menu{display:none}}
</style></head><body>
<div id="auth" class="auth"><div class="box"><h1>MADHAV <span style="color:#2457e6">ACADEMY</span></h1><p class="muted">Learn • Practice • Master</p><section id="login"><h2>Login</h2><form id="loginForm"><label>Name</label><input id="ln" required><label>Password</label><input id="lp" type="password" required><p id="le" style="color:#c33"></p><button class="primary" style="width:100%">Login</button></form><p>New student? <button id="toCreate" class="secondary" type="button">Create Account</button></p></section><section id="create" class="hidden"><h2>Create Account</h2><form id="createForm"><label>Name</label><input id="cn" required><label>Grade</label><select id="cg" required><option value="">Choose grade</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select><label>School</label><input id="cs" required><label>Password</label><input id="cp" type="password" minlength="4" required><label>Confirm password</label><input id="cc" type="password" required><p id="ce" style="color:#c33"></p><button class="primary" style="width:100%">Create Account</button></form><p>Already have an account? <button id="toLogin" class="secondary" type="button">Login</button></p></section></div></div>
<div id="app" class="app hidden"><aside id="side" class="side"><h2>MADHAV <span style="color:#78a1ff">ACADEMY</span></h2><div class="nav"><button data-page="home">🏠 Dashboard</button><button data-page="subjects">📚 Subjects</button><button data-page="worksheets">📝 Worksheets</button><button data-page="quizzes">🧠 Quizzes</button><button data-page="progress">📊 Progress</button><button data-page="profile">👤 Profile</button><button data-page="settings">⚙️ Settings</button></div><div class="bottom"><p id="sideUser"></p><button id="logout" class="danger" style="width:100%">Logout</button></div></aside><main class="main"><header class="top"><div class="row"><button id="menu" class="secondary">☰</button><input id="search" class="search" placeholder="Search chapters..."></div><button id="theme" class="secondary">🌙</button></header><div id="content" class="content"></div></main></div><div id="modal"></div>
<script>
const AK='MA_ACCOUNTS_7',SK='MA_SESSION_7';let page='home',subject='All',chapter=null,quiz=null;const S=['English','Mathematics','Science','Social Science'];const C={6:['Who Did Patrick’s Homework?','Knowing Our Numbers','Food: Where Does It Come From?','The Earth in the Solar System'],7:['Three Questions','Integers','Nutrition in Plants','On Equality'],8:['A Tale of Valour','Magic Brush of Dreams','Squares and Square Roots','Cubes and Cube Roots','Working with Fractions','Invisible Living World Beyond the Naked Eye','Electric Current and its Effects','Nature of Matter','How Nature Works in Harmony','Reshaping India’s Political Map','Natural Resources','The Colonial Era in India','Universal Adult Franchise and India’s Electoral System','Parliamentary System','Types of Phrases and Clauses'],9:['The Fun They Had','Number Systems','Matter in Our Surroundings','What is Democracy? Why Democracy?'],10:['A Letter to God','Real Numbers','Chemical Reactions and Equations','Power Sharing']};
const subjectOf=t=>t.includes('Square')||t.includes('Cube')||t.includes('Fraction')||t==='Integers'||t==='Knowing Our Numbers'||t==='Number Systems'||t==='Real Numbers'?'Mathematics':t.includes('Matter')||t.includes('Living World')||t.includes('Electric')||t.includes('Nutrition')||t.includes('Chemical')||t.includes('Life Processes')||t.includes('Plants')?'Science':t.includes('India')||t.includes('Resources')||t.includes('Colonial')||t.includes('Universal')||t.includes('Parliamentary')||t.includes('Democracy')||t.includes('Equality')||t.includes('Earth')||t.includes('Power Sharing')?'Social Science':'English';
const detail=t=>({summary:`${t} is studied through its key ideas, terms, examples and applications. Read the main concept, revise the important points and practise the questions.`,concepts:['Main idea','Key terms','Examples','Applications'],terms:['definition','concept','example'],questions:[`What is the main idea of ${t}?`,`Write two important points from ${t}.`,`Give one example related to ${t}.`,`Write a short revision note on ${t}.`]});
const get=()=>{try{return JSON.parse(localStorage.getItem(AK)||'[]')}catch{return[]}},save=a=>localStorage.setItem(AK,JSON.stringify(a)),user=()=>get().find(x=>x.id===sessionStorage.getItem(SK));
function showAuth(){document.getElementById('auth').classList.remove('hidden');document.getElementById('app').classList.add('hidden');}function openApp(){document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()};function go(p){page=p;chapter=null;quiz=null;document.getElementById('side').classList.remove('open');render()};
function render(){let u=user();if(!u){showAuth();return}document.getElementById('sideUser').textContent=`${u.name} • Grade ${u.grade}`;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html='';if(page==='home')html=home(u);if(page==='subjects')html=subjects(u);if(page==='worksheets')html=worksheets(u);if(page==='quizzes')html=quizzes(u);if(page==='progress')html=progress(u);if(page==='profile')html=profile(u);if(page==='settings')html=settings(u);document.getElementById('content').innerHTML=html}
function home(u){return `<div class="hero"><h1>Welcome, ${u.name.split(' ')[0]}!</h1><p>Learn • Practice • Master</p></div><div class="stats"><div class="stat"><b>${C[u.grade].length}</b><br><span class="muted">Chapters</span></div><div class="stat"><b>${u.done.length}</b><br><span class="muted">Completed</span></div><div class="stat"><b>${Object.keys(u.scores).length}</b><br><span class="muted">Quizzes</span></div><div class="stat"><b>${u.done.length?Math.round(u.done.length/C[u.grade].length*100):0}%</b><br><span class="muted">Progress</span></div></div><h2>Subjects</h2><div class="grid">${S.map(x=>`<div class="card"><h3>${x}</h3><p class="muted">Study ${x} chapters.</p><button class="primary" data-sub="${x}">Open Subject</button></div>`).join('')}</div>`}
function subjects(u){let list=C[u.grade].filter(t=>subject==='All'||subjectOf(t)===subject).filter(t=>t.toLowerCase().includes(document.getElementById('search').value.toLowerCase()));return `<h2>Subjects</h2><div class="tabs"><button data-sub="All" class="${subject==='All'?'active':''}">All</button>${S.map(x=>`<button data-sub="${x}" class="${subject===x?'active':''}">${x}</button>`).join('')}</div><div class="grid">${list.map(t=>`<div class="card"><small class="muted">${subjectOf(t)}</small><h3>${t}</h3><p>${detail(t).summary}</p><div class="row"><button class="primary" data-study="${t}">Study</button><button class="secondary" data-ws="${t}">Worksheets</button></div></div>`).join('')}</div>`}
function worksheets(u){return `<h2>Worksheets</h2><p class="muted">Chapter-specific A4 worksheets with MADHAV ACADEMY watermark.</p><div class="grid">${C[u.grade].map(t=>`<div class="card"><small>${subjectOf(t)}</small><h3>${t}</h3><button class="primary" data-ws="${t}">Open Worksheets</button></div>`).join('')}</div>`}
function quizzes(u){return `<h2>Quiz Centre</h2><div class="grid">${C[u.grade].map(t=>`<div class="card"><h3>${t}</h3><p class="muted">${u.scores[t]===undefined?'Not attempted':'Last score: '+u.scores[t]+'%'}</p><button class="primary" data-quiz="${t}">Start Quiz</button></div>`).join('')}</div>`}
function progress(u){return `<h2>Progress</h2><div class="card"><h3>Completed chapters: ${u.done.length}/${C[u.grade].length}</h3>${C[u.grade].map(t=>`<p>${t} — ${u.done.includes(t)?'100%':'0%'}</p>`).join('')}</div>`}
function profile(u){return `<h2>Editable Profile</h2><form id="profileForm" class="card" style="max-width:650px"><label>Name</label><input id="pn" value="${esc(u.name)}" required><label>Grade</label><select id="pg">${[6,7,8,9,10].map(g=>`<option ${g==u.grade?'selected':''}>${g}</option>`).join('')}</select><label>School</label><input id="ps" value="${esc(u.school)}" required><label>New password</label><input id="pp" type="password" placeholder="Leave blank to keep current"><button class="primary">Save Changes</button></form>`}
function settings(u){return `<h2>Settings</h2><div class="card"><button id="theme2" class="secondary">Toggle Dark Mode</button><button id="reset" class="danger">Reset Progress</button><button id="logout2" class="danger">Logout</button></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openStudy(t){let d=detail(t);chapter=t;document.getElementById('content').innerHTML=`<button class="secondary" data-page="subjects">← Back</button><div class="card" style="margin-top:15px"><small>${subjectOf(t)}</small><h1>${t}</h1><h3>Summary</h3><p>${d.summary}</p><h3>Key Concepts</h3><ul>${d.concepts.map(x=>`<li>${x}</li>`).join('')}</ul><h3>Important Terms</h3><p>${d.terms.join(' • ')}</p><h3>Important Questions</h3><ol>${d.questions.map(x=>`<li>${x}</li>`).join('')}</ol><div class="row"><button class="primary" data-ws="${t}">Worksheets</button><button class="secondary" data-quiz="${t}">Quiz</button><button class="secondary" data-done="${t}">Mark Complete</button></div></div>`}
function openWS(t){let qs=detail(t).questions;document.getElementById('modal').innerHTML=`<div class="modal"><div><div class="row" style="justify-content:space-between"><h2>${t} — Worksheets</h2><button data-close>✕</button></div><div class="tabs"><button data-paper="1">WS 1</button><button data-paper="2">WS 2</button><button data-paper="3">WS 3</button><button data-paper="4">Revision</button></div><div id="paper">${paper(t,qs,1)}</div></div></div>`}
function paper(t,qs,type){let title=['','Concept Check','Practice Paper','Application Challenge','Revision Worksheet'][type];let arr=type===1?qs:type===2?[...qs,'Explain one important term.','Write three revision points.']:type===3?['Explain the main concept using a real-life example.','Compare two important ideas.','Write a reasoned answer to an important question.','Create a short exam revision note.']:qs.concat(['Define the most important term.','Write two things you must remember.']);return `<div class="paper"><div class="watermark">MADHAV ACADEMY</div><h1>MADHAV ACADEMY</h1><h2>${title}</h2><p><b>Student:</b> ${esc(user().name)} &nbsp; <b>Grade:</b> ${user().grade} &nbsp; <b>School:</b> ${esc(user().school)}</p><hr>${arr.map((q,i)=>`<div class="q"><b>Q${i+1}. ${q}</b><div style="height:75px"></div></div>`).join('')}<button class="primary" data-print>Print / Save PDF</button></div>`}
function startQuiz(t){quiz={title:t,questions:[{q:'What should you do after studying a chapter?',o:['Revise and practise','Ignore it','Skip it','None'],a:0},{q:'Which section helps you revise?',o:['Important questions','Nothing','Login','Settings'],a:0},{q:'What is the purpose of practice?',o:['Improve understanding','Avoid learning','Delete progress','None'],a:0},{q:'What should an answer contain?',o:['Relevant ideas','Random words','Nothing','Only emojis'],a:0},{q:'What is a useful final step?',o:['Revision','Ignoring the topic','Closing the book forever','None'],a:0}]};page='quiz';renderQuiz()}
function renderQuiz(){let q=quiz;document.getElementById('content').innerHTML=`<div class="card"><h2>${q.title} Quiz</h2><form id="quizForm">${q.questions.map((x,i)=>`<div class="q"><b>${i+1}. ${x.q}</b>${x.o.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')}<button class="primary">Submit Quiz</button></form></div>`}
function toggleDark(){document.body.classList.toggle('dark');if(document.body.classList.contains('dark'))document.body.style.background='#0d1320';else document.body.style.background='#f4f7fb'}

document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){go(b.dataset.page);return}if(b.id==='toCreate'){login.classList.add('hidden');create.classList.remove('hidden');return}if(b.id==='toLogin'){create.classList.add('hidden');login.classList.remove('hidden');return}if(b.id==='logout'||b.id==='logout2'){sessionStorage.removeItem(SK);showAuth();return}if(b.id==='menu'){side.classList.toggle('open');return}if(b.id==='theme'||b.id==='theme2'){toggleDark();return}if(b.dataset.sub){subject=b.dataset.sub;page='subjects';render();return}if(b.dataset.study){openStudy(b.dataset.study);return}if(b.dataset.ws){openWS(b.dataset.ws);return}if(b.dataset.quiz){startQuiz(b.dataset.quiz);return}if(b.dataset.done){let u=user();if(!u.done.includes(b.dataset.done))u.done.push(b.dataset.done);save(get());render();return}if(b.dataset.close){modal.innerHTML='';return}if(b.dataset.paper){let t=modal.querySelector('h2').textContent.split(' — ')[0];let qs=detail(t).questions;paper.innerHTML=paper(t,qs,Number(b.dataset.paper));return}if(b.dataset.print){let p=document.querySelector('.paper').outerHTML,w=window.open('','_blank');if(w){w.document.write('<html><body>'+p+'<style>@media print{button{display:none}}body{font-family:Arial}.paper{position:relative;padding:40px}.watermark{position:absolute;inset:0;display:grid;place-items:center;color:#2457e615;font-size:55px;transform:rotate(-30deg)}</style></body></html>');w.document.close();w.print()}return}if(b.id==='reset'){let u=user();u.done=[];u.scores={};save(get());render();return}});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();let u=get().find(x=>x.name.toLowerCase()===ln.value.trim().toLowerCase()&&x.password===lp.value);if(!u){le.textContent='Incorrect name or password.';return}sessionStorage.setItem(SK,u.id);le.textContent='';openApp()}if(e.target.id==='createForm'){e.preventDefault();ce.textContent='';if(cp.value!==cc.value){ce.textContent='Passwords do not match.';return}if(get().some(x=>x.name.toLowerCase()===cn.value.trim().toLowerCase())){ce.textContent='Account already exists.';return}let u={id:Date.now().toString(),name:cn.value.trim(),grade:Number(cg.value),school:cs.value.trim(),password:cp.value,done:[],scores:{}};let a=get();a.push(u);save(a);sessionStorage.setItem(SK,u.id);openApp()}if(e.target.id==='profileForm'){e.preventDefault();let u=user();u.name=pn.value.trim();u.grade=Number(pg.value);u.school=ps.value.trim();if(pp.value)u.password=pp.value;save(get());render() }if(e.target.id==='quizForm'){e.preventDefault();let score=0;quiz.questions.forEach((x,i)=>{let r=document.querySelector(`input[name=q${i}]:checked`);if(r&&Number(r.value)===x.a)score++});let u=user();u.scores[quiz.title]=Math.round(score/quiz.questions.length*100);save(get());alert('Quiz score: '+u.scores[quiz.title]+'%');quiz=null;page='quizzes';render()}});
document.getElementById('search').addEventListener('input',()=>{if(page==='subjects')render()});
if(sessionStorage.getItem(SK)&&user())openApp();else showAuth();
</script></body></html>
