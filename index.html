<script>
async function connectBand() {
    if (!navigator.bluetooth) {
        alert("Bluetooth is not supported in this browser. Try Chrome or Edge.");
        return;
    }

    try {
        const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true
        });

        console.log("Found band:", device.name);

        if (!device.gatt) {
            alert("This device does not support Bluetooth GATT.");
            return;
        }

        const server = await device.gatt.connect();

        alert("Smart AI Band connected!");

        console.log("Connected to:", device.name);
        console.log("Bluetooth server:", server);

    } catch (error) {
        console.error("Bluetooth error:", error);
        alert("Bluetooth connection cancelled or failed.");
    }
}
</script>
